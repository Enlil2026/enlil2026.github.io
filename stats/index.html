<!DOCTYPE html>
<html>
<head>
  <style>
    /* 1. Dashboard Background */
    body {
      background-color: #1a1a2e;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    /* 2. The Stats Card */
    .card {
      background: #16213e;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
      border: 1px solid #0f3460;
    }

    h2 {
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #4ecca3;
      margin-bottom: 10px;
    }

    /* 3. The Big Glowing Number */
    #display-count {
      font-size: 80px;
      font-weight: bold;
      display: block;
      margin: 20px 0;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(78, 204, 163, 0.5);
    }

    /* 4. Professional Reset Button */
    #reset-btn {
      background-color: transparent;
      color: #e94560;
      border: 2px solid #e94560;
      padding: 10px 25px;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    #reset-btn:hover {
      background-color: #e94560;
      color: white;
      box-shadow: 0 0 15px rgba(233, 69, 96, 0.4);
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Total Page Views</h2>
    <span id="display-count">0</span>
    <button id="reset-btn" onclick="resetCounter()">RESET DASHBOARD</button>
  </div>

  <script src="../js/counter.js"></script>
<script>
    displayCounter(); // Just show the number when this page loads
</script>



</body>
</html>
